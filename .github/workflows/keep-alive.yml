name: Keep backend awake

# Hugging Face pauses free Spaces after 48 hours without traffic.
# A light health check twice a day keeps the TripMind API available.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the API health endpoint
        env:
          HEALTH_URL: https://arjunrajawat-tripmindai.hf.space/actuator/health
        run: |
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$HEALTH_URL" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 60
          done
          echo "The backend did not report healthy. Check the Space logs on Hugging Face."
          exit 1
