# ===== TripMind - application configuration =====
server.port=${PORT:7860}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ===== Database =====
# Defaults to in-memory H2 for zero-config local dev. For PostgreSQL / Supabase set:
#   DB_URL=jdbc:postgresql://host:5432/db   DB_DRIVER=org.postgresql.Driver
#   DB_USER / DB_PASSWORD                   JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL:jdbc:h2:mem:travel_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# ===== External APIs (both optional) =====
# Gemini discovers destinations (verified and costed by TripMind). Without a key the built-in catalogue is used.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}

# ===== Web =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,https://travelai-frontend.vercel.app,https://tripmind-ai.vercel.app,https://tripmind-ai.com,https://www.tripmind-ai.com}
app.frontend.path=${FRONTEND_PATH:file:../frontend/}

# ===== Admin =====
admin.username=${ADMIN_USER:admin}
admin.password=${ADMIN_PASS:change_this_in_production}

# ===== Logging & monitoring =====
logging.level.com.tripmind=${APP_LOG_LEVEL:INFO}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
