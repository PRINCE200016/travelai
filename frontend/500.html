<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong — TripMind</title>
  <meta name="description" content="Something went wrong on our side. Please try again in a moment, or contact TripMind if it keeps happening.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11201f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    .oops { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 96px); align-items: center; }
    .oops .lede { margin-top: var(--s-4); }
    .oops-code { font-size: var(--fs-sm); font-weight: 650; color: var(--text-3); margin-bottom: var(--s-3); }
    .oops-actions { margin-top: var(--s-6); }
    .oops-links { margin-top: var(--s-6); padding-top: var(--s-5); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: var(--fs-sm); }
    .oops-photo { border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 4 / 5; background: var(--ink-800); }
    .oops-photo img { width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 820px) { .oops { grid-template-columns: 1fr; } .oops-photo { aspect-ratio: 16 / 9; order: -1; } }
  </style>
</head>
<body data-page="error">
  <header data-site-header></header>

  <main id="main">
    <section class="section">
      <div class="wrap oops">
        <div>
          <p class="oops-code">Error 500</p>
          <h1 class="h-display">Something went wrong on our side.</h1>
          <p class="lede">It's not anything you did. Please try again in a minute. If it keeps happening, let us know what you were doing and we'll look into it.</p>
          <div class="row oops-actions">
            <button class="btn btn-primary btn-lg" type="button" id="retry"><span data-icon="refresh"></span>Try again</button>
            <a class="btn btn-lg" href="/">Go to the home page</a>
          </div>
          <div class="oops-links">
            <a class="link" href="/plan.html">Plan a trip</a>
            <a class="link" href="/saved.html">Saved trips</a>
            <a class="link" href="/contact.html">Tell us about it</a>
          </div>
        </div>
        <div class="oops-photo">
          <img src="https://images.unsplash.com/photo-1610715936287-6c2ad208cdbf?auto=format&fit=crop&w=1400&q=70"
               alt="Rowing boats resting on Naini Lake, hills behind">
        </div>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>

  <script src="/js/config.js"></script>
  <script src="/js/site.js"></script>
  <script>
    document.getElementById('retry').addEventListener('click', function () { window.location.reload(); });
  </script>
</body>
</html>
