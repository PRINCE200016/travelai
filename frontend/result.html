<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your trips — TripMind</title>
  <meta name="description" content="Trips that fit your budget, costed door to door: travel, stay, food, local transport and activities.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11201f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="plan">
  <header data-site-header></header>

  <main id="main">
    <div class="results-head">
      <div class="wrap">
        <div class="row between">
          <h1 class="h-1" id="resultsTitle">Finding your trips</h1>
          <a class="btn" id="editSearch" href="plan.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Edit search</a>
        </div>
        <div class="query-bar" id="queryBar"></div>
      </div>
    </div>

    <div class="wrap" id="results" aria-live="polite" aria-busy="true">
      <div class="loading-state">
        <div class="loading-line"><span class="spinner"></span><span id="loadingText">Costing routes from your city…</span></div>
        <div class="trip">
          <div><div class="skeleton" style="aspect-ratio:16/9"></div><div class="skeleton" style="height:40px;width:50%;margin-top:24px"></div><div class="skeleton" style="height:80px;margin-top:16px"></div></div>
          <div class="skeleton" style="height:360px"></div>
        </div>
      </div>
    </div>
  </main>

  <dialog class="modal" id="shareDialog" aria-labelledby="shareTitle">
    <div class="modal-head"><h2 class="h-3" id="shareTitle">Share this plan</h2><button class="icon-btn" type="button" data-close aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="modal-body stack">
      <p class="muted small">Anyone with the link sees the same search, recalculated with today's prices.</p>
      <div class="row"><input class="input" id="shareUrl" readonly aria-label="Link to this plan" style="flex:1"><button class="btn btn-dark" type="button" id="copyLink">Copy</button></div>
      <a class="btn btn-block" id="shareWhatsapp" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/></svg>Send on WhatsApp</a>
    </div>
  </dialog>

  <footer data-site-footer></footer>

  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/query.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
